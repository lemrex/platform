apiVersion: apps/v1
kind: Deployment
metadata:
  name: placeholder-service
  labels:
    app: placeholder-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: placeholder-service
  template:
    metadata:
      labels:
        app: placeholder-service
    spec:
      containers:
        - name: app
          image: placeholder-image:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
