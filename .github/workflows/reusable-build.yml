name: reusable-build

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      language:
        required: true
        type: string   # go | node | java | python -> selects the Dockerfile template
      dockerfile_ref:
        required: false
        type: string
        default: v1.0.0   # pin to a platform-templates release tag
    secrets:
      SWR_USERNAME:
        required: true
      SWR_PASSWORD:
        required: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout service repo
        uses: actions/checkout@v4

      - name: Checkout platform
        uses: actions/checkout@v4
        with:
          repository: lemrex/platform
          ref: ${{ inputs.dockerfile_ref }}
          path: .platform

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to SWR
        uses: docker/login-action@v3
        with:
          registry: swr.af-south-1.myhuaweicloud.com
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .platform/dockerfiles/${{ inputs.language }}.Dockerfile
          push: true
          build-args: |
            SERVICE_NAME=${{ inputs.service_name }}
          tags: |
            swr.af-south-1.myhuaweicloud.com/rafel/${{ inputs.service_name }}:${{ github.sha }}
          cache-from: type=registry,ref=swr.af-south-1.myhuaweicloud.com/rafel/${{ inputs.service_name }}:cache
          cache-to: type=registry,ref=swr.af-south-1.myhuaweicloud.com/rafel/${{ inputs.service_name }}:cache,mode=max

      # - name: Scan image
      #   uses: aquasecurity/trivy-action@0.33.1
      #   with:
      #     image-ref: swr.af-south-1.myhuaweicloud.com/rafel/${{ inputs.service_name }}:${{ github.sha }}
      #     severity: CRITICAL,HIGH
      #     exit-code: 1


      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: swr.af-south-1.myhuaweicloud.com/rafel/${{ inputs.service_name }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 1